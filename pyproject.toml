[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-test-cases"
version = "0.1.0"
description = "Validation, indexing and selection for an Excel-based QA test-case repository"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
qa-cases = "qa_cases.cli:main"

[tool.setuptools.packages.find]
include = ["qa_cases*"]
