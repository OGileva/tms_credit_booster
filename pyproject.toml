[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tms-cb"
version = "0.2.0"
description = "AI-first Git catalog for QA test cases"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2"
]

[project.scripts]
qa-cases = "qa_cases.cli:main"

[tool.setuptools.packages.find]
include = ["qa_cases*"]
